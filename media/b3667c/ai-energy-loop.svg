<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="A loop, labelled an opportunity not a guarantee: compute, better forecasts and grids, new materials and storage, cheaper clean energy, cheaper water moving through recycling and desalination, back to compute. In the middle: it only spins if grids and permits keep up, the gains get deployed, rebound effects are managed and policy prices the side effects." fill="none" stroke-linecap="round" stroke-linejoin="round"><rect width="960" height="640" fill="#fff"/>
