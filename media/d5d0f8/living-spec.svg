<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="A short illustrative test: a prepaid customer in Melbourne subscribes to Sports, the device sees it, billing shows one charge, they cancel, the device no longer sees it, no support tickets. Arrows: a new developer reads what the product does, and CI checks it is still true every deploy." fill="none" stroke-linecap="round" stroke-linejoin="round"><rect width="960" height="500" fill="#fff"/>
