<text x="56" y="146" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#3b36b8" fill-opacity="1" text-anchor="start" stroke="none">def test_prepaid_customer_buys_and_cancels():</text>
<text x="71.6" y="174" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1a1a1a" fill-opacity="1" text-anchor="start" stroke="none">customer = new_customer(city=&quot;Melbourne&quot;,</text>
<text x="258.8" y="202" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1a1a1a" fill-opacity="1" text-anchor="start" stroke="none">card=&quot;prepaid&quot;)</text>
<text x="71.6" y="230" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1a1a1a" fill-opacity="1" text-anchor="start" stroke="none">sub = customer.subscribe(&quot;Sports&quot;)</text>
<text x="71.6" y="258" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#11968a" fill-opacity="1" text-anchor="start" stroke="none">assert customer.device.sees(&quot;Sports&quot;)</text>
<text x="71.6" y="286" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#11968a" fill-opacity="1" text-anchor="start" stroke="none">assert billing.charges(customer) == [PRICE]</text>
<text x="71.6" y="314" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1a1a1a" fill-opacity="1" text-anchor="start" stroke="none">customer.cancel()</text>
<text x="71.6" y="342" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#11968a" fill-opacity="1" text-anchor="start" stroke="none">assert not customer.device.sees(&quot;Sports&quot;)</text>
<text x="71.6" y="370" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#11968a" fill-opacity="1" text-anchor="start" stroke="none">assert support.tickets(customer) == []</text>
